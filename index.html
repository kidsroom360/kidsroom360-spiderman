
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Room 360 - Spider-Man</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

#panorama {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: 'PANAROMIC.png',
    autoLoad: true,
    autoRotate: -2,
    showControls: true,
    mouseZoom: true,
    compass: false,
    hfov: 100,
    minHfov: 50,
    maxHfov: 120
});
</script>

</body>
</html>
